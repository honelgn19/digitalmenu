<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark select-none">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SELAM | Admin Portal</title>
  
  <!-- Mobile Web App Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b0d12">

  <!-- Tailwind CSS v3 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#e6b763',
              darkGold: '#b38020',
              bgDark: '#0b0d12',
              surfaceDark: '#131722',
              cardDark: 'rgba(22, 27, 38, 0.75)'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans Ethiopic', 'sans-serif'],
            display: ['Outfit', 'Noto Sans Ethiopic', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0b0d12] text-slate-100 font-sans min-h-screen antialiased pb-12">

  <!-- Mobile-First Admin Header -->
  <header class="bg-[#121621]/95 backdrop-blur-md border-b border-white/10 px-4 sm:px-6 py-3 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <!-- Brand & Portal Title -->
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-br from-amber-400 to-amber-700 flex items-center justify-center text-lg font-bold text-white shadow-lg shadow-amber-500/20">✨</div>
        <div class="flex flex-col">
          <h1 class="font-display font-bold text-base sm:text-lg text-amber-400 leading-tight">SELAM RESTAURANT</h1>
          <p class="text-[10px] sm:text-xs text-slate-400">Admin Portal</p>
        </div>
      </div>

      <!-- Action Controls: View Menu & Logout -->
      <div class="flex items-center gap-2">
        <a href="/menu" target="_blank" class="px-3 py-2 bg-slate-900 border border-white/10 rounded-xl text-xs font-semibold text-slate-300 hover:text-white flex items-center gap-1 transition-colors min-h-[40px]">
          <span>📱</span> <span class="hidden xs:inline">View </span>Menu
        </a>
        <button id="adminLogoutBtn" class="px-3 py-2 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 rounded-xl text-xs font-bold transition-all min-h-[40px]">
          🔒 Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Admin Main Dashboard Content -->
  <main class="max-w-7xl mx-auto px-3.5 sm:px-6 py-5">
    
    <!-- Mobile 2x2 Grid Stats Overview Cards -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6" id="statsContainer">
      <div class="bg-[#141824] border border-white/10 p-3.5 sm:p-4 rounded-2xl shadow-xl flex items-center justify-between">
        <div>
          <div class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Dishes</div>
          <div class="text-xl sm:text-2xl font-bold font-display text-white mt-0.5" id="statTotalItems">--</div>
        </div>
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center justify-center text-lg sm:text-xl">🍲</div>
      </div>

      <div class="bg-[#141824] border border-white/10 p-3.5 sm:p-4 rounded-2xl shadow-xl flex items-center justify-between">
        <div>
          <div class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">In Stock</div>
          <div class="text-xl sm:text-2xl font-bold font-display text-emerald-400 mt-0.5" id="statInStock">--</div>
        </div>
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-lg sm:text-xl">🟢</div>
      </div>

      <div class="bg-[#141824] border border-white/10 p-5 rounded-2xl shadow-xl flex items-center justify-between">
        <div>
          <div class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Sold Out</div>
          <div class="text-xl sm:text-2xl font-bold font-display text-rose-400 mt-0.5" id="statSoldOut">--</div>
        </div>
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/30 flex items-center justify-center text-lg sm:text-xl">🔴</div>
      </div>

      <div class="bg-[#141824] border border-white/10 p-3.5 sm:p-4 rounded-2xl shadow-xl flex items-center justify-between">
        <div>
          <div class="text-[10px] sm:text-xs font-semibold text-slate-400 uppercase tracking-wider">Categories</div>
          <div class="text-xl sm:text-2xl font-bold font-display text-indigo-400 mt-0.5" id="statCategories">--</div>
        </div>
        <div class="w-9 h-9 sm:w-11 sm:h-11 rounded-xl bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 flex items-center justify-center text-lg sm:text-xl">📂</div>
      </div>
    </div>

    <!-- Management Controls Bar -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 mb-5">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 flex-1">
        <!-- Search Filter -->
        <input type="text" id="adminSearchInput" class="bg-slate-900 border border-white/10 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder-slate-400 outline-none focus:border-amber-400" placeholder="Search dish name...">
        
        <!-- Category Filter -->
        <select id="adminCategoryFilter" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400">
          <option value="all">All Categories</option>
          <option value="traditional-mains">Traditional Meat Mains</option>
          <option value="veggie-fasting">Fasting Specials (የጾም)</option>
          <option value="starters">Starters & Breakfast</option>
          <option value="seafood">Seafood</option>
          <option value="desserts-drinks">Coffee & Drinks</option>
        </select>

        <!-- Stock Filter -->
        <select id="adminAvailabilityFilter" class="bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400">
          <option value="all">All Stock Status</option>
          <option value="instock">In Stock</option>
          <option value="soldout">Sold Out</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <button id="refreshAdminBtn" class="px-3.5 py-2.5 bg-slate-900 border border-white/10 text-slate-300 rounded-xl text-xs font-semibold hover:text-white flex items-center gap-1 transition-all min-h-[44px]">
          🔄 Refresh
        </button>
        <button id="openAddDishModalBtn" class="flex-1 sm:flex-none px-4 py-2.5 bg-gradient-to-r from-amber-400 to-amber-600 text-black font-extrabold rounded-xl text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-amber-500/20 active:scale-95 transition-transform min-h-[44px]">
          <span>➕</span> Add New Dish
        </button>
      </div>
    </div>

    <!-- Mobile View: Clean Card List (visible on small screens) -->
    <div class="block sm:hidden space-y-3" id="adminMobileCardContainer">
      <!-- Dynamically Rendered Mobile Cards -->
    </div>

    <!-- Desktop View: Table (hidden on small mobile screens) -->
    <div class="hidden sm:block bg-[#141824] border border-white/10 rounded-2xl overflow-hidden shadow-2xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-900/90 border-b border-white/10 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
              <th class="p-4">Dish Photo</th>
              <th class="p-4">Dish Title</th>
              <th class="p-4">Category</th>
              <th class="p-4">Price (ETB)</th>
              <th class="p-4">Fasting Type</th>
              <th class="p-4">Stock Availability</th>
              <th class="p-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="adminMenuTableBody" class="divide-y divide-white/5 text-xs">
            <!-- Dynamically Rendered Menu Rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Add New Ethiopian Dish Mobile Bottom-Sheet Modal -->
  <div class="modal-overlay fixed inset-0 z-50 bg-black/80 backdrop-blur-md p-3 sm:p-4" id="addDishModal" style="display: none;">
    <div class="modal-card bg-[#141824] border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl p-5 sm:p-6 relative">
      <button class="modal-close-btn absolute top-3 right-3 z-10 w-8 h-8 rounded-full bg-black/60 border border-white/20 text-white flex items-center justify-center hover:bg-rose-600" id="closeAddDishModalBtn">✕</button>
      
      <h3 class="text-lg sm:text-xl font-bold font-display text-amber-400 mb-1">➕ Add New Ethiopian Dish</h3>
      <p class="text-xs text-slate-400 mb-5">Create a new menu record saved directly to your database.</p>

      <form id="addDishForm" class="space-y-3.5">
        <!-- Titles -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Title (English) *</label>
            <input type="text" id="titleEn" required class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400" placeholder="e.g. Special Gomen Tibs">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Title (አማርኛ) <span class="text-slate-500 font-normal">(Optional)</span></label>
            <input type="text" id="titleAm" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400" placeholder="ምሳሌ፡ ልዩ ጎመን ጥብስ">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Title (Afaan Oromoo) <span class="text-slate-500 font-normal">(Optional)</span></label>
            <input type="text" id="titleOm" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400" placeholder="e.g. Tibsi Goomana Addaa">
          </div>
        </div>

        <!-- Category & Price -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Category *</label>
            <select id="dishCategory" required class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400">
              <option value="traditional-mains">Traditional Meat Mains</option>
              <option value="veggie-fasting">Fasting Specials (የጾም)</option>
              <option value="starters">Starters & Breakfast</option>
              <option value="seafood">Seafood</option>
              <option value="desserts-drinks">Coffee & Drinks</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Price in ETB (Br) *</label>
            <input type="number" id="dishPrice" required min="1" step="10" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400" placeholder="850">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Spiciness Level (0-3)</label>
            <select id="dishSpiciness" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400">
              <option value="0">0 - Mild / None</option>
              <option value="1">1 - Low Spice 🌶️</option>
              <option value="2">2 - Medium Spice 🌶️🌶️</option>
              <option value="3">3 - Hot Berbere / Mitmita 🌶️🌶️🌶️</option>
            </select>
          </div>
        </div>

        <!-- Image URL Flexible Link -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Image Link / URL <span class="text-slate-500 font-normal">(Optional)</span></label>
          <input type="text" id="dishImage" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400" placeholder="Paste image link or leave blank for automatic high-res food photo">
        </div>

        <!-- Prep Time & Calories -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Prep Time (mins)</label>
            <input type="number" id="dishPrepMinutes" value="15" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-300 mb-1">Calories (kcal)</label>
            <input type="number" id="dishCalories" value="500" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-amber-400">
          </div>
        </div>

        <!-- Fasting Radio Options -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-2">Fasting Type & Signature</label>
          <div class="flex flex-wrap gap-3 text-xs text-slate-300">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="fastingType" value="fasting" class="accent-emerald-400" checked> 🥗 Fasting Dish (የጾም)</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="fastingType" value="nonFasting" class="accent-rose-400"> 🥩 Non-Fasting Dish (የነጻ/የስጋ)</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" id="checkChefSpecial" class="accent-amber-400"> ⭐ Chef Signature</label>
          </div>
        </div>

        <!-- Descriptions -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Description (English) <span class="text-slate-500 font-normal">(Optional)</span></label>
          <textarea id="descEn" rows="2" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white resize-none outline-none focus:border-amber-400" placeholder="Detailed culinary description..."></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Description (አማርኛ) <span class="text-slate-500 font-normal">(Optional)</span></label>
          <textarea id="descAm" rows="2" class="w-full bg-slate-900 border border-white/10 rounded-xl px-3 py-2 text-xs text-white resize-none outline-none focus:border-amber-400" placeholder="የምግቡ ማብራሪያ..."></textarea>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-amber-600 text-black font-extrabold rounded-xl text-xs sm:text-sm shadow-lg shadow-amber-500/20 active:scale-95 transition-transform min-h-[44px]">
            💾 Save Dish
          </button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    // Authentication Protection Check
    const token = localStorage.getItem('selam_admin_token') || sessionStorage.getItem('selam_admin_token');
    if (!token) {
      window.location.href = 'login.html';
    }

    // Logout Handler
    document.getElementById('adminLogoutBtn').addEventListener('click', () => {
      localStorage.removeItem('selam_admin_token');
      localStorage.removeItem('selam_admin_user');
      sessionStorage.removeItem('selam_admin_token');
      sessionStorage.removeItem('selam_admin_user');
      window.location.href = 'login.html';
    });

    let adminState = {
      items: [],
      categories: [],
      filterCategory: 'all',
      filterAvailability: 'all',
      searchQuery: ''
    };

    // Load Admin Metrics & Dish List
    async function loadAdminData() {
      try {
        const res = await fetch('/api/admin/menu');
        if (res.ok) {
          const data = await res.json();
          adminState.items = data.items || [];
          adminState.categories = data.categories || [];
          updateStats(data.stats);
          renderAdminTable();
        }
      } catch (err) {
        console.error('Error fetching admin data:', err);
      }
    }

    function updateStats(stats) {
      if (!stats) return;
      document.getElementById('statTotalItems').textContent = stats.totalItems || 0;
      document.getElementById('statInStock').textContent = stats.inStockItems || 0;
      document.getElementById('statSoldOut').textContent = stats.soldOutItems || 0;
      document.getElementById('statCategories').textContent = stats.totalCategories || 0;
    }

    // Render Admin Views (Table for Desktop + Cards for Mobile)
    function renderAdminTable() {
      const tbody = document.getElementById('adminMenuTableBody');
      const mobileContainer = document.getElementById('adminMobileCardContainer');

      let filtered = adminState.items.filter(item => {
        if (adminState.filterCategory !== 'all') {
          const itemCatSlug = item.category ? item.category.slug : item.categoryId;
          if (itemCatSlug !== adminState.filterCategory) return false;
        }

        if (adminState.filterAvailability === 'instock' && !item.isAvailable) return false;
        if (adminState.filterAvailability === 'soldout' && item.isAvailable) return false;

        if (adminState.searchQuery.trim() !== '') {
          const q = adminState.searchQuery.toLowerCase();
          const title = (item.translations && item.translations[0]?.title) || (typeof item.title === 'string' ? item.title : (item.title?.en || ''));
          return title.toLowerCase().includes(q);
        }

        return true;
      });

      if (filtered.length === 0) {
        if (tbody) {
          tbody.innerHTML = `
            <tr>
              <td colspan="7" class="p-8 text-center text-slate-500">
                No Ethiopian dishes found. Click "Add New Dish" to create one.
              </td>
            </tr>
          `;
        }
        if (mobileContainer) {
          mobileContainer.innerHTML = `
            <div class="p-8 text-center bg-[#141824] border border-white/10 rounded-2xl text-slate-500 text-xs">
              No Ethiopian dishes found. Click "Add New Dish" to create one.
            </div>
          `;
        }
        return;
      }

      // Render Desktop Table
      if (tbody) {
        tbody.innerHTML = filtered.map(item => {
          const title = (item.translations && item.translations[0]?.title) || (typeof item.title === 'string' ? item.title : (item.title?.en || 'Ethiopian Dish'));
          const categoryName = (item.category && item.category.translations && item.category.translations[0]?.title) || item.categoryId || 'Main Dish';
          const isAvailable = item.isAvailable !== false;
          const imageUrl = item.image || 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80';
          
          const isFastingDish = item.categoryId === 'veggie-fasting' || 
                                Boolean(item.isFasting) || 
                                (item.dietaryTags && (item.dietaryTags.includes('fasting') || item.dietaryTags.includes('vegan') || item.dietaryTags.includes('vegetarian')));
          const fastingBadge = isFastingDish 
            ? `<span class="text-emerald-400 font-semibold">🥗 Fasting (የጾም)</span>`
            : `<span class="text-rose-400 font-semibold">🥩 Non-Fasting (የነጻ)</span>`;

          return `
            <tr class="hover:bg-white/5 transition-colors">
              <td class="p-4">
                <img src="${imageUrl}" alt="${title}" class="w-12 h-12 rounded-xl object-cover border border-white/10" />
              </td>
              <td class="p-4">
                <div class="font-bold text-white">${title}</div>
                <div class="text-[10px] text-slate-400">${item.id}</div>
              </td>
              <td class="p-4 capitalize text-slate-400 font-medium">${categoryName}</td>
              <td class="p-4 font-bold text-amber-400 text-sm">${item.priceETB} Br</td>
              <td class="p-4 text-xs">${fastingBadge}</td>
              <td class="p-4">
                <button class="toggle-availability-btn px-3 py-1 rounded-full text-[11px] font-bold flex items-center gap-1.5 transition-all ${isAvailable ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'}" data-id="${item.id}" data-status="${isAvailable}">
                  ${isAvailable ? '🟢 In Stock' : '🔴 Sold Out'}
                </button>
              </td>
              <td class="p-4 text-right">
                <button class="delete-dish-btn px-3 py-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/40 rounded-lg text-xs font-semibold transition-colors" data-id="${item.id}">
                  🗑️ Delete
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }

      // Render Mobile Card List
      if (mobileContainer) {
        mobileContainer.innerHTML = filtered.map(item => {
          const title = (item.translations && item.translations[0]?.title) || (typeof item.title === 'string' ? item.title : (item.title?.en || 'Ethiopian Dish'));
          const categoryName = (item.category && item.category.translations && item.category.translations[0]?.title) || item.categoryId || 'Main Dish';
          const isAvailable = item.isAvailable !== false;
          const imageUrl = item.image || 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80';

          const isFastingDish = item.categoryId === 'veggie-fasting' || 
                                Boolean(item.isFasting) || 
                                (item.dietaryTags && (item.dietaryTags.includes('fasting') || item.dietaryTags.includes('vegan') || item.dietaryTags.includes('vegetarian')));
          const fastingBadge = isFastingDish 
            ? `<span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-md text-[10px] font-semibold">🥗 የጾም</span>`
            : `<span class="bg-rose-500/10 text-rose-300 border border-rose-500/30 px-2 py-0.5 rounded-md text-[10px] font-semibold">🥩 የነጻ</span>`;

          return `
            <div class="bg-[#141824] border border-white/10 rounded-2xl p-3.5 shadow-lg flex flex-col gap-3">
              <div class="flex items-center gap-3">
                <img src="${imageUrl}" alt="${title}" class="w-14 h-14 rounded-xl object-cover border border-white/10" />
                <div class="flex-1">
                  <div class="font-bold text-white text-sm leading-snug">${title}</div>
                  <div class="flex items-center gap-2 mt-1">
                    <span class="font-bold text-amber-400 text-xs">${item.priceETB} Br</span>
                    <span class="text-[10px] text-slate-400 capitalize">• ${categoryName}</span>
                  </div>
                  <div class="mt-1">${fastingBadge}</div>
                </div>
              </div>
              <div class="flex items-center justify-between gap-2 pt-2 border-t border-white/5">
                <button class="toggle-availability-btn flex-1 py-2 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${isAvailable ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-rose-500/20 text-rose-400 border border-rose-500/40'}" data-id="${item.id}" data-status="${isAvailable}">
                  ${isAvailable ? '🟢 In Stock' : '🔴 Sold Out'}
                </button>
                <button class="delete-dish-btn py-2 px-3 bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 border border-rose-500/40 rounded-xl text-xs font-semibold transition-colors" data-id="${item.id}">
                  🗑️ Delete
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      // Bind Toggle & Delete Handlers across desktop & mobile
      document.querySelectorAll('.toggle-availability-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          const currentStatus = btn.getAttribute('data-status') === 'true';
          const newStatus = !currentStatus;

          try {
            await fetch(`/api/menu/${id}/availability`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ isAvailable: newStatus })
            });
            await loadAdminData();
          } catch (err) {
            console.error('Availability toggle failed:', err);
          }
        });
      });

      document.querySelectorAll('.delete-dish-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-id');
          if (confirm('Are you sure you want to delete this dish from the database?')) {
            try {
              await fetch(`/api/menu/${id}`, { method: 'DELETE' });
              await loadAdminData();
            } catch (err) {
              console.error('Delete dish failed:', err);
            }
          }
        });
      });
    }

    document.getElementById('adminSearchInput').addEventListener('input', (e) => {
      adminState.searchQuery = e.target.value;
      renderAdminTable();
    });

    document.getElementById('adminCategoryFilter').addEventListener('change', (e) => {
      adminState.filterCategory = e.target.value;
      renderAdminTable();
    });

    document.getElementById('adminAvailabilityFilter').addEventListener('change', (e) => {
      adminState.filterAvailability = e.target.value;
      renderAdminTable();
    });

    document.getElementById('refreshAdminBtn').addEventListener('click', loadAdminData);

    const modal = document.getElementById('addDishModal');
    document.getElementById('openAddDishModalBtn').addEventListener('click', () => {
      modal.classList.add('open');
    });

    document.getElementById('closeAddDishModalBtn').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.classList.remove('open');
    });

    document.getElementById('addDishForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const isFasting = document.querySelector('input[name="fastingType"]:checked')?.value === 'fasting';
      const dietaryTags = [isFasting ? 'fasting' : 'nonFasting'];

      const titleEn = document.getElementById('titleEn').value.trim();
      const titleAm = document.getElementById('titleAm').value.trim() || titleEn;
      const titleOm = document.getElementById('titleOm').value.trim() || titleEn;

      const descEn = document.getElementById('descEn').value.trim() || `Authentic Ethiopian ${titleEn} cooked to perfection with traditional herbs and spices.`;
      const descAm = document.getElementById('descAm').value.trim() || `በጥንቃቄ የተዘጋጀ ባህላዊ የኢትዮጵያ ${titleAm}።`;
      
      let imageUrl = document.getElementById('dishImage').value.trim();
      if (!imageUrl) {
        imageUrl = 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80';
      }

      const payload = {
        categoryId: document.getElementById('dishCategory').value,
        priceETB: Number(document.getElementById('dishPrice').value),
        spiciness: Number(document.getElementById('dishSpiciness').value),
        prepMinutes: Number(document.getElementById('dishPrepMinutes').value),
        calories: Number(document.getElementById('dishCalories').value),
        isChefSpecial: document.getElementById('checkChefSpecial').checked,
        isFasting,
        dietaryTags,
        image: imageUrl,
        titleEn,
        titleAm,
        titleOm,
        descEn,
        descAm
      };

      try {
        const res = await fetch('/api/menu', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('✅ New Ethiopian Dish successfully saved to database!');
          modal.classList.remove('open');
          document.getElementById('addDishForm').reset();
          await loadAdminData();
        }
      } catch (err) {
        alert('Failed to save dish: ' + err.message);
      }
    });

    document.addEventListener('DOMContentLoaded', loadAdminData);
  </script>
</body>
</html>
