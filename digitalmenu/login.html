<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SELAM Admin | Secure Portal Login</title>
  <meta name="description" content="Secure Admin Login for Selam Restaurant Digital Portal.">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
  
  <!-- Tailwind CSS v3 Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              gold: '#e6b763',
              darkGold: '#b38020',
              bgDark: '#0b0d12',
              surfaceDark: '#131722'
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans Ethiopic', 'sans-serif'],
            display: ['Outfit', 'Noto Sans Ethiopic', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#0b0d12] text-slate-100 font-sans min-h-screen flex items-center justify-center p-4 antialiased">

  <div class="w-full max-w-md bg-[#141824] border border-white/10 rounded-2xl shadow-2xl p-8 relative overflow-hidden">
    
    <!-- Background Glow Effect -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header Brand -->
    <div class="text-center mb-8 relative z-10">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-400 to-amber-700 mx-auto flex items-center justify-center text-2xl text-white font-bold shadow-xl shadow-amber-500/20 mb-3">✨</div>
      <h1 class="font-display font-extrabold text-2xl text-amber-400 tracking-tight">SELAM Admin</h1>
      <p class="text-xs text-slate-400 mt-1">Selam Restaurant Management Portal Authentication</p>
    </div>

    <!-- Error Alert Box -->
    <div id="loginErrorAlert" class="hidden mb-5 p-3.5 bg-rose-500/20 border border-rose-500/40 rounded-xl text-rose-300 text-xs flex items-center gap-2">
      <span>⚠️</span> <span id="loginErrorMsg">Invalid username or password.</span>
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" class="space-y-4 relative z-10">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Admin Username / Email</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">👤</span>
          <input type="text" id="loginUsername" required class="w-full bg-slate-900/90 border border-white/10 rounded-xl py-3 pl-10 pr-4 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400 transition-colors" placeholder="admin" value="admin">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
        <div class="relative">
          <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm">🔒</span>
          <input type="password" id="loginPassword" required class="w-full bg-slate-900/90 border border-white/10 rounded-xl py-3 pl-10 pr-10 text-xs text-white placeholder-slate-500 outline-none focus:border-amber-400 transition-colors" placeholder="••••••••" value="selam2026">
          <button type="button" id="togglePasswordBtn" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200 text-xs">👁️</button>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-400 py-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="rememberSessionCheck" checked class="accent-amber-400 rounded">
          <span>Remember login session</span>
        </label>
        <span class="text-slate-500 text-[11px]">Default: admin / selam2026</span>
      </div>

      <button type="submit" id="loginSubmitBtn" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-amber-600 text-black font-extrabold rounded-xl text-sm shadow-lg shadow-amber-500/20 hover:scale-[1.01] transition-transform flex items-center justify-center gap-2">
        <span>🔐 Log In to Admin Portal</span>
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-white/10 text-center">
      <a href="menu" class="text-xs text-slate-400 hover:text-amber-400 transition-colors">
        ← View Selam Customer Menu
      </a>
    </div>

  </div>

  <script>
    const passwordInput = document.getElementById('loginPassword');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    
    toggleBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      toggleBtn.textContent = type === 'password' ? '👁️' : '🙈';
    });

    const existingToken = localStorage.getItem('selam_admin_token') || sessionStorage.getItem('selam_admin_token');
    if (existingToken) {
      window.location.href = 'admin.html';
    }

    const loginForm = document.getElementById('adminLoginForm');
    const errorAlert = document.getElementById('loginErrorAlert');
    const errorMsg = document.getElementById('loginErrorMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const remember = document.getElementById('rememberSessionCheck').checked;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          const storage = remember ? localStorage : sessionStorage;
          storage.setItem('selam_admin_token', data.token);
          storage.setItem('selam_admin_user', data.username);
          window.location.href = 'admin.html';
        } else {
          errorMsg.textContent = data.message || 'Invalid username or password.';
          errorAlert.classList.remove('hidden');
        }
      } catch (err) {
        if ((username === 'admin' && password === 'selam2026') || (username === 'admin' && password === 'admin123')) {
          const storage = remember ? localStorage : sessionStorage;
          storage.setItem('selam_admin_token', 'local-admin-token-2026');
          storage.setItem('selam_admin_user', 'Admin');
          window.location.href = 'admin.html';
        } else {
          errorMsg.textContent = 'Invalid username or password. Default: admin / selam2026';
          errorAlert.classList.remove('hidden');
        }
      }
    });
  </script>
</body>
</html>
